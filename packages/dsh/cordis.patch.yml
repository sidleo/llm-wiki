# dsh-wiki bundle patch: inserts the plugin row into a DSH profile roster.
# Applied as a profile bundle layer (package.json `dsh.bundle.patch`) over dsh-base.
# Install with:
#   dsh plugin --profile <name> add @sidleo3/dsh-wiki
#   # or from a checkout:
#   dsh plugin --profile <name> add link:/path/to/packages/dsh
#
# Row is a bare plugin by npm package name: the node half (exports ".")
# runs in the host process (描述层注入 + wiki_* 工具)。
# 数据目录默认 ~/.agents/wiki（wiki.mjs 内以 os.homedir() 计算）；覆盖用 id 定向补丁：
#   - id: wiki-registry
#     config:
#       dataDir: /abs/path/to/bundle
#       sectionName: wiki-registry
#       sectionOrder: 62
#       maxSectionChars: 6000
# 多目录（命名 bundle）：config.dataDirs 声明，与注册表 ~/.agents/wiki-registry.json 合并
# （同名配置优先）；wiki_dirs 查看，wiki_use <name> [global:true] 切换（会话级/持久化全局默认）。
# 详见 wiki_help bundle。
#   config:
#     dataDirs:
#       工作: /abs/path/to/bundle-a
#       个人: ~/notes/wiki
- insert:
    - id: wiki-registry
      name: '@sidleo3/dsh-wiki'
      config:
        sectionName: wiki-registry
        sectionOrder: 62
        maxSectionChars: 6000
        maxGetChars: 40000
        cacheTtlMs: 30000
